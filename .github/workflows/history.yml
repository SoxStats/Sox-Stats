name: Update history

on:
  schedule:
    - cron: "41 10 1 * *"   # first of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/history.py", "scripts/war.py", ".github/workflows/history.yml"]

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download every season, MLB and minor leagues
        run: python scripts/history.py

      - name: Download Baseball-Reference WAR
        run: python scripts/war.py
        continue-on-error: true

      - name: Save updated history
        run: |
          git config user.name "sox-stats bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update history $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
