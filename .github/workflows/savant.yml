name: Update Statcast discipline

on:
  schedule:
    - cron: "53 10 2 * *"   # second of every month
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/savant.py", ".github/workflows/savant.yml"]

permissions:
  contents: write

concurrency:
  group: update-savant
  cancel-in-progress: false

jobs:
  savant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Statcast plate discipline, 2015 on
        run: python scripts/savant.py
      - name: Save
        run: |
          git config user.name "sox-stats bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/savant_batting.csv.gz
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update Statcast discipline $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
